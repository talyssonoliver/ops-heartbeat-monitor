name: Workflow keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. This repo is rarely committed to, so the
# dead-man monitor would silently stop (a GitHub warning arrived 2026-10-07,
# 53 days after the last push). Calling the "enable workflow" endpoint on a
# workflow that is already enabled resets that 60-day timer, so twice a month
# this re-enables every workflow here, itself included. A workflow someone
# disabled on purpose (disabled_manually) is left alone.

on:
  schedule:
    - cron: '17 6 1,15 * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | [.id, .state, .path] | @tsv' |
          while IFS="$(printf '\t')" read -r id state path; do
            if [ "$state" = "disabled_manually" ]; then
              echo "skip ${path}: disabled on purpose"
              continue
            fi
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            echo "re-enabled ${path} (was ${state})"
          done
